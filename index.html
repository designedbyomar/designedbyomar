<script>
// Runs before first paint. Two jobs, both of which need the stored theme:
//   1. Apply the saved theme, so light-mode visitors don't see a dark flash while
//      the React bundle parses. Templates ship data-theme="dark"; React sets the
//      same value again on mount, so this only ever wins the race, never fights it.
//   2. Preload the hero portrait, whose correct variant depends on that theme.
//      Only two routes render the portrait, so every other route skips it.
// imagesrcset/imagesizes are set before href so the browser has the candidate list
// when it resolves the URL, the same reason srcset precedes src on an img.
(function () {
  var light = false;
  try { light = localStorage.getItem('omar.theme') === 'light'; } catch (e) { light = false; }
  if (light) document.documentElement.dataset.theme = 'light';

  // Only the homepage renders the hero portrait. /work used to render it too, but
  // it is now its own case-study index, so preloading there fetched an image the page
  // never paints.
  var path = location.pathname.replace(/\/+$/, '') || '/';
  if (path !== '/') return;

  var link = document.createElement('link');
  link.rel = 'preload';
  link.as = 'image';
  link.setAttribute('fetchpriority', 'high');
  if (light) {
    link.href = '/Images/omar-light.webp';
  } else {
    link.setAttribute('imagesrcset', '/Images/omar-mobile.webp 640w, /Images/omar.webp 1230w');
    link.setAttribute('imagesizes', '(max-width: 820px) min(100vw, 590px), 590px');
    link.href = '/Images/omar.webp';
  }
  document.head.appendChild(link);
})();
</script>
